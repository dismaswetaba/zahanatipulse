<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ZahanatiPulse - Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <main class="card">
        <h1>Dashboard</h1>
        <p id="welcome">Loading account details...</p>
        <button id="logout" type="button">Log out</button>
    </main>

    <script>
        async function loadUser() {
            const welcome = document.getElementById("welcome");
            try {
                const response = await fetch("/api/auth/me");
                if (response.status === 401) {
                    window.location.href = "/login";
                    return;
                }
                if (!response.ok) {
                    throw new Error("Could not load account details");
                }
                const user = await response.json();
                welcome.textContent =
                    "Welcome, " + user.full_name +
                    " (" + user.role + ") - " + user.facility_name;
            } catch (error) {
                welcome.textContent = "Unable to load dashboard. Please try again.";
            }
        }

        document.getElementById("logout").addEventListener("click", async () => {
            try {
                const response = await fetch("/api/auth/logout", {
                    method: "POST"
                });
                if (!response.ok) {
                    throw new Error("Logout failed");
                }
                window.location.href = "/login";
            } catch (error) {
                document.getElementById("welcome").textContent =
                    "Could not log out. Please try again.";
            }
        });

        loadUser();
    </script>
</body>
</html>
